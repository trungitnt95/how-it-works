name: Deploy to GitHub Pages

on:
  # Manual: Actions tab -> "Deploy to GitHub Pages" -> Run workflow -> pick main or develop
  workflow_dispatch:
  # Keep the live site in sync with main and develop
  push:
    branches: [main, develop]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only main and develop may deploy; other branches are skipped.
    # Also enforce in Settings -> Environments -> github-pages -> Deployment branches.
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Static site, no build step: publish the repo root as-is
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
